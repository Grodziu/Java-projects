<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1060" viewBox="0 0 1360 1060">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#9BAAB9"/></marker></defs>
<rect width="1360" height="1060" fill="#F6F5FA"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#14243A">
<text x="40" y="45" font-size="27" font-weight="700">BidRoom · schemat PostgreSQL 1.1</text>
<text x="40" y="73" font-size="14" fill="#516176">Strzałka prowadzi od tabeli nadrzędnej do zależnej. Pełne relacje FK podano w kartach.</text>
<path d="M400 180 H490" fill="none" stroke="#9BAAB9" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M850 180 H940" fill="none" stroke="#9BAAB9" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M220 330 V420" fill="none" stroke="#9BAAB9" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M400 255 H447 V820 H400" fill="none" stroke="#9BAAB9" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M670 355 V420" fill="none" stroke="#9BAAB9" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M850 275 H900 V500 H940" fill="none" stroke="#9BAAB9" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M850 300 H875 V705 H670 V730" fill="none" stroke="#9BAAB9" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M850 310 H915 V800 H940" fill="none" stroke="#9BAAB9" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="100" width="360" height="213" rx="12" fill="white" stroke="#DFE5ED"/>
<rect x="40" y="100" width="360" height="8" rx="4" fill="#007EB5"/>
<text x="60" y="142" font-size="22" font-weight="700" fill="#007EB5">app_user</text>
<text x="60" y="176" font-size="14">PK id : BIGINT (1, 2, 3…)</text>
<text x="60" y="204" font-size="14">legacy_uuid : UUID UNIQUE</text>
<text x="60" y="232" font-size="14">login_normalized : UNIQUE</text>
<text x="60" y="260" font-size="14">display_name, role, enabled</text>
<text x="60" y="288" font-size="14">password_hash, salt, iterations</text>
<rect x="490" y="100" width="360" height="241" rx="12" fill="white" stroke="#DFE5ED"/>
<rect x="490" y="100" width="360" height="8" rx="4" fill="#8A3E90"/>
<text x="510" y="142" font-size="22" font-weight="700" fill="#8A3E90">auction</text>
<text x="510" y="176" font-size="14">PK id : UUID</text>
<text x="510" y="204" font-size="14">auction_number : BIGINT UNIQUE</text>
<text x="510" y="232" font-size="14">FK owner_id, leader_id → app_user</text>
<text x="510" y="260" font-size="14">title, description, category, status</text>
<text x="510" y="288" font-size="14">current_price, bid_count, version</text>
<text x="510" y="316" font-size="14">start_at, end_at, photo_version</text>
<rect x="940" y="100" width="360" height="213" rx="12" fill="white" stroke="#DFE5ED"/>
<rect x="940" y="100" width="360" height="8" rx="4" fill="#D42B78"/>
<text x="960" y="142" font-size="22" font-weight="700" fill="#D42B78">bid</text>
<text x="960" y="176" font-size="14">PK id : UUID</text>
<text x="960" y="204" font-size="14">FK auction_id → auction</text>
<text x="960" y="232" font-size="14">FK bidder_id → app_user</text>
<text x="960" y="260" font-size="14">sequence_no, amount, accepted_at</text>
<text x="960" y="288" font-size="14">UNIQUE bidder_id + command_request_id</text>
<rect x="40" y="420" width="360" height="185" rx="12" fill="white" stroke="#DFE5ED"/>
<rect x="40" y="420" width="360" height="8" rx="4" fill="#009A98"/>
<text x="60" y="462" font-size="22" font-weight="700" fill="#009A98">security_audit</text>
<text x="60" y="496" font-size="14">PK id : UUID</text>
<text x="60" y="524" font-size="14">FK actor_id → app_user</text>
<text x="60" y="552" font-size="14">FK target_user_id → app_user</text>
<text x="60" y="580" font-size="14">action, occurred_at, details</text>
<rect x="490" y="420" width="360" height="185" rx="12" fill="white" stroke="#DFE5ED"/>
<rect x="490" y="420" width="360" height="8" rx="4" fill="#65A524"/>
<text x="510" y="462" font-size="22" font-weight="700" fill="#65A524">auction_photo</text>
<text x="510" y="496" font-size="14">PK / FK auction_id → auction</text>
<text x="510" y="524" font-size="14">content : BYTEA (do 2 MB)</text>
<text x="510" y="552" font-size="14">version, sha256, width, height</text>
<text x="510" y="580" font-size="14">created_at</text>
<rect x="940" y="420" width="360" height="213" rx="12" fill="white" stroke="#DFE5ED"/>
<rect x="940" y="420" width="360" height="8" rx="4" fill="#EB8A18"/>
<text x="960" y="462" font-size="22" font-weight="700" fill="#EB8A18">auction_event</text>
<text x="960" y="496" font-size="14">PK id : UUID</text>
<text x="960" y="524" font-size="14">FK auction_id → auction</text>
<text x="960" y="552" font-size="14">FK actor_id → app_user</text>
<text x="960" y="580" font-size="14">auction_version, event_type</text>
<text x="960" y="608" font-size="14">occurred_at, details : JSONB</text>
<rect x="40" y="730" width="360" height="213" rx="12" fill="white" stroke="#DFE5ED"/>
<rect x="40" y="730" width="360" height="8" rx="4" fill="#007EB5"/>
<text x="60" y="772" font-size="22" font-weight="700" fill="#007EB5">diagnostic_log</text>
<text x="60" y="806" font-size="14">PK id : UUID</text>
<text x="60" y="834" font-size="14">FK reported_by_user_id → app_user</text>
<text x="60" y="862" font-size="14">origin : CLIENT / SERVER</text>
<text x="60" y="890" font-size="14">event_type, message, received_at</text>
<text x="60" y="918" font-size="14">auction_id : identyfikator zdarzenia</text>
<rect x="490" y="730" width="360" height="185" rx="12" fill="white" stroke="#DFE5ED"/>
<rect x="490" y="730" width="360" height="8" rx="4" fill="#8A3E90"/>
<text x="510" y="772" font-size="22" font-weight="700" fill="#8A3E90">auction_report</text>
<text x="510" y="806" font-size="14">PK / FK auction_id → auction</text>
<text x="510" y="834" font-size="14">filename : UNIQUE</text>
<text x="510" y="862" font-size="14">sha256, bytes, generated_at</text>
<text x="510" y="890" font-size="14">Treść .txt: katalog reports/ serwera</text>
<rect x="940" y="730" width="360" height="185" rx="12" fill="white" stroke="#DFE5ED"/>
<rect x="940" y="730" width="360" height="8" rx="4" fill="#D42B78"/>
<text x="960" y="772" font-size="22" font-weight="700" fill="#D42B78">command_result</text>
<text x="960" y="806" font-size="14">PK user_id + request_id</text>
<text x="960" y="834" font-size="14">FK user_id → app_user</text>
<text x="960" y="862" font-size="14">operation, input_digest (HMAC)</text>
<text x="960" y="890" font-size="14">result : JSONB, created_at</text>
<text x="40" y="1030" font-size="14" fill="#516176">PK — klucz główny · FK — klucz obcy · UUID aukcji/polecenia zachowuje tożsamość; konta mają proste numery.</text>
</g></svg>